# Quando o acesso vem de um túnel/proxy https, preserva o "https" para o Django.
map $http_x_forwarded_proto $proto_original {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;          # planilhas .xlsx
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    # API, painel /admin/ e CSS do admin: vão para o Django
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_original;
        proxy_read_timeout 60s;
    }

    # Arquivos do site com nome único (podem ficar em cache por muito tempo)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Qualquer outro endereço (ex.: /confirmar) abre o site React
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
